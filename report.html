<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabungan Report</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Style Bar Navigasi Tab */
        .tab-bar {
            display: flex;
            background-color: #2c3e50;
            border-bottom: 2px solid #1a252f;
        }
        .tab-button {
            background-color: inherit;
            color: #ecf0f1;
            padding: 14px 20px;
            border: none;
            outline: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .tab-button:hover {
            background-color: #34495e;
        }
        .tab-button.active {
            background-color: #3498db;
            color: #ffffff;
        }
        /* Style Kontainer Content / Iframe */
        .content-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
        iframe.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Tombol Navigasi Tab -->
    <div class="tab-bar">
        <button class="tab-button active" onclick="openReport(event, 'report1')">Sosialisasi Bulan Keluarga</button>
        <button class="tab-button" onclick="openReport(event, 'report2')">Perarakan Korona</button>
        <button class="tab-button" onclick="openReport(event, 'report3')">Penyala Lilin</button>
    </div>

    <!-- Halaman Report via Iframe -->
    <div class="content-container">
        <iframe id="report1" class="active" src="https://tkky.my.id/sosbk/report.html"></iframe>
        <iframe id="report2" src="https://tkky.my.id/korona/report.html"></iframe>
        <iframe id="report3" src="https://tkky.my.id/penyalalilin/report.html"></iframe>
    </div>

    <script>
        function openReport(evt, reportId) {
            // Sembunyikan semua iframe
            const iframes = document.querySelectorAll('.content-container iframe');
            iframes.forEach(iframe => iframe.classList.remove('active'));

            // Hapus status active dari semua tombol tab
            const tabButtons = document.querySelectorAll('.tab-button');
            tabButtons.forEach(button => button.classList.remove('active'));

            // Tampilkan iframe dan tombol tab yang dipilih
            document.getElementById(reportId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>

</body>
</html>
