<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membuka Formulir..</title>

  <script>
    // link target 
    const TARGET_URL = "https://forms.gle/HTNi4T7mp1oC2Yum9";

    // Inject meta refresh & canonical link secara dinamis
    document.write(`
      <meta http-equiv="refresh" content="0; url=${TARGET_URL}">
      <link rel="canonical" href="${TARGET_URL}">
    `);

    // Redirect via JavaScript
    window.location.href = TARGET_URL;
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 90%;
    }
    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <p>Sedang memebuka formulir...</p>
    <p><small>Jika halaman tidak berpindah secara otomatis, <a id="redirect-link" href="#">klik di sini</a>.</small></p>
  </div>

  <script>
    // Pasang link fallback pada elemen <a>
    document.getElementById("redirect-link").href = TARGET_URL;
  </script>
</body>
</html>
